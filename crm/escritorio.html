<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Escritório virtual | XYZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060f;--borda:rgba(30,144,255,.28);--texto:#eaf3ff;--suave:#93a9c9;--azul:#1e90ff;--azul2:#8cc8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--texto);font-family:Inter,system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(2,6,15,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda)}
header h1{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:1px;color:var(--azul2);text-shadow:0 0 12px rgba(30,144,255,.8)}
header .esp{flex:1}
.btn{background:linear-gradient(135deg,#0052ff,#1e90ff 55%,#00b8ff);border:0;border-radius:10px;padding:9px 14px;font-weight:700;color:#fff;cursor:pointer;font:inherit;font-size:13px;text-decoration:none;white-space:nowrap}
.btn.sec{background:rgba(9,24,56,.85);border:1px solid var(--borda)}
#relogio{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--suave)}
#palco{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 45%,#0a2350,#02060f 70%)}
canvas{image-rendering:pixelated;display:block}
#lado{position:fixed;left:14px;bottom:14px;z-index:4;width:230px;background:rgba(3,10,26,.82);border:1px solid var(--borda);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}
#lado h3{font-size:12px;color:var(--suave);margin-bottom:8px;font-weight:600}
.pessoa{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.pessoa i{width:9px;height:9px;border-radius:50%;background:#475569;flex:none}
.pessoa i.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.pessoa i.alm{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
.pessoa small{margin-left:auto;color:var(--suave);font-size:11px}
#menu{position:fixed;z-index:8;background:rgba(3,10,26,.95);border:1px solid var(--borda);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#menu b{font-size:12px;color:var(--azul2);padding:2px 6px 6px}
#menu button{background:none;border:0;color:var(--texto);text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
#menu button:hover{background:rgba(30,144,255,.15)}
#menu form{display:flex;gap:4px;padding:4px 2px 0}
#menu input{flex:1;min-width:0;background:rgba(9,24,56,.85);border:1px solid var(--borda);border-radius:8px;padding:6px 8px;color:var(--texto);font:inherit;font-size:13px}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .caixa{background:rgba(3,10,26,.97);border:1px solid var(--borda);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
#modal h3{margin-bottom:4px}
#modal p{color:var(--suave);font-size:13px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--suave);font-weight:600;font-size:11px;padding:6px 4px}
td{padding:5px 4px}
td input{width:100%;background:rgba(9,24,56,.85);border:1px solid var(--borda);border-radius:8px;padding:6px;color:var(--texto);font:inherit;font-size:13px;color-scheme:dark}
#dica{position:fixed;right:14px;bottom:14px;z-index:4;font-size:12px;color:var(--suave);background:rgba(3,10,26,.8);border:1px solid var(--borda);border-radius:10px;padding:8px 12px}
@media (max-width:760px){#lado{width:auto;right:14px;bottom:10px;max-height:28vh;overflow:auto}#dica{display:none}header h1{font-size:10px}#relogio{display:none}}
</style>
</head>
<body>
<header>
  <a class="btn sec" href="./">← CRM</a>
  <h1>ESCRITÓRIO XYZ</h1>
  <div class="esp"></div>
  <span id="relogio"></span>
  <button class="btn sec" id="btn-horarios" hidden>⏰ Horários</button>
</header>
<div id="palco"><canvas id="cv"></canvas></div>
<div id="lado"><h3>Equipe agora</h3><div id="lista"></div></div>
<div id="dica">Clique em alguém para interagir 👋 <span style="opacity:.5;margin-left:8px">móveis: Kenney.nl (CC0)</span></div>
<div id="menu" hidden></div>
<div id="modal" hidden>
  <div class="caixa">
    <h3>⏰ Horários da equipe</h3>
    <p>No horário de almoço o bonequinho vai para a cozinha; depois da saída, vai embora pela porta.</p>
    <table><thead><tr><th>Nome</th><th>Entrada</th><th>Almoço início</th><th>Almoço fim</th><th>Saída</th></tr></thead><tbody id="tb-hor"></tbody></table>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn sec" id="hor-fechar">Fechar</button><button class="btn" id="hor-salvar">Salvar horários</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="presenca.js"></script>
<script>
const CFG = window.CRM_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let eu = null, equipe = [], online = new Set();

/* ================== CENA ISOMÉTRICA (móveis: Kenney, CC0) ================== */
const GX = 6, GY = 5, TW = 150, TH = 105, WH = 130;
const IW = (GX + GY) * TW / 2 + 90, IH = WH + 60 + (GX + GY) * TH / 2 + 20;
const OX = GY * TW / 2 + 45, OY = WH + 50;
const cv = $('#cv'), mctx = cv.getContext('2d');
const off = document.createElement('canvas'); off.width = IW; off.height = IH;
const ctx = off.getContext('2d');
let S = 1;
const iso = (x, y) => [OX + (x - y) * TW / 2, OY + (x + y) * TH / 2];
function ajustar() {
  const w = innerWidth, h = innerHeight - 56;
  S = Math.min(w / IW, h / IH);
  cv.width = Math.floor(IW * S); cv.height = Math.floor(IH * S);
  cv.style.marginTop = '56px';
}
addEventListener('resize', ajustar); ajustar();

const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };
function poly(pts, c, contorno) {
  ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = c; ctx.fill();
  if (contorno) { ctx.strokeStyle = contorno; ctx.lineWidth = 1; ctx.stroke(); }
}
function caixa(gx, gy, sx, sy, h, [topo, esq, dir], z = 0) {
  const up = ([x, y], k) => [x, y - k];
  const A = iso(gx, gy), B = iso(gx + sx, gy), C = iso(gx + sx, gy + sy), D = iso(gx, gy + sy);
  poly([up(D, z), up(C, z), up(C, z + h), up(D, z + h)], esq, 'rgba(14,12,34,.5)');
  poly([up(B, z), up(C, z), up(C, z + h), up(B, z + h)], dir, 'rgba(14,12,34,.5)');
  poly([up(A, z + h), up(B, z + h), up(C, z + h), up(D, z + h)], topo, 'rgba(14,12,34,.4)');
}
function naParedeFundo(gx, z) { const [x, y] = iso(gx, 0); return [x, y - z]; }
function naParedeEsq(gy, z) { const [x, y] = iso(0, gy); return [x, y - z]; }
function quadFundo(a, b, z0, z1, c, contorno) { poly([naParedeFundo(a, z0), naParedeFundo(b, z0), naParedeFundo(b, z1), naParedeFundo(a, z1)], c, contorno); }
function quadEsq(a, b, z0, z1, c, contorno) { poly([naParedeEsq(a, z0), naParedeEsq(b, z0), naParedeEsq(b, z1), naParedeEsq(a, z1)], c, contorno); }
function pontoNaFrente(gx, gy, z) { const [x, y] = iso(gx, gy); return [x, y - z]; }

/* ---------- sprites dos móveis ---------- */
const ANC = {"floorFull_SE":[151,110,74.5,109],"desk_NW":[85,88,54.0,87],"desk_SW":[85,88,54.0,87],"deskCorner_SW":[103,132,28.5,131],"deskCorner_NW":[103,132,72.5,131],"chairDesk_SE":[44,71,17.0,70],"chairDesk_SW":[45,70,27.0,69],"computerScreen_NW":[34,40,25.0,39],"computerScreen_NE":[34,40,0.5,39],"computerKeyboard_NW":[30,22,20.0,21],"laptop_SW":[37,38,18.5,37],"loungeSofa_SE":[104,103,28.5,102],"loungeSofa_SW":[103,103,72.5,102],"loungeSofaCorner_SE":[148,108,73.5,107],"loungeSofaCorner_SW":[103,135,28.5,134],"loungeChair_SE":[67,77,28.5,76],"loungeChair_SW":[66,77,35.5,76],"tableCoffeeGlass_SE":[80,74,29.0,73],"tableCoffeeGlass_SW":[80,74,48.5,73],"rugRound_SE":[99,71,48.5,70],"rugRectangle_SE":[188,134,68.5,133],"rugRectangle_SW":[188,134,118.0,133],"lampRoundFloor_SE":[19,76,8.5,75],"lampSquareFloor_SE":[19,78,8.5,77],"pottedPlant_SE":[21,60,9.5,59],"plantSmall1_SE":[11,14,4.0,13],"plantSmall2_SE":[11,14,4.0,13],"plantSmall3_SE":[10,15,4.0,14],"bookcaseOpen_SW":[49,101,29.0,100],"bookcaseOpen_SE":[50,101,18.5,100],"bookcaseClosedWide_SW":[80,116,60.0,115],"books_SE":[19,19,5.5,18],"kitchenFridge_SE":[52,105,17.5,104],"kitchenFridge_SW":[52,105,32.5,104],"kitchenCabinet_SE":[67,79,30.5,78],"kitchenCabinet_SW":[67,79,34.5,78],"kitchenSink_SE":[67,79,30.5,78],"kitchenSink_SW":[67,79,34.5,78],"kitchenStove_SE":[67,79,30.5,78],"kitchenStove_SW":[67,79,34.5,78],"kitchenCoffeeMachine_SE":[26,32,16.5,31],"kitchenCoffeeMachine_SW":[25,32,7.5,31],"kitchenMicrowave_SE":[37,40,14.5,39],"kitchenMicrowave_SW":[37,39,21.5,38],"kitchenBar_SE":[49,64,12.5,63],"kitchenBar_SW":[49,64,34.5,63],"kitchenBarEnd_SE":[19,42,10.0,41],"stoolBar_SE":[27,49,12.0,48],"stoolBarSquare_SE":[23,46,10.0,45],"tableRound_SE":[83,69,40.5,68],"chair_SE":[31,57,14.5,56],"chair_SW":[31,57,14.0,56],"chairRounded_SE":[31,52,14.5,51],"chairRounded_SW":[31,52,14.0,51],"televisionModern_SW":[55,68,51.0,67],"televisionModern_SE":[54,68,1.5,67],"cabinetTelevision_SW":[80,80,60.0,79],"cabinetTelevision_SE":[80,79,18.5,78],"speaker_SE":[23,64,10.5,63],"speaker_SW":[23,64,10.5,63],"speakerSmall_SE":[22,37,9.5,36],"trashcan_SE":[25,46,16.5,45],"coatRackStanding_SE":[24,73,13.0,72],"sideTable_SE":[58,68,16.5,67],"lampRoundTable_SE":[19,35,8.5,34],"radio_SE":[31,36,7.5,35],"cardboardBoxClosed_SE":[32,39,15.5,38],"chairDesk_SE_preto":[44,71,17.0,70],"chairDesk_SW_preto":[45,70,27.0,69]};
const IMG = {};
for (const n in ANC) { const im = new Image(); im.src = 'mobilia/' + n + '.png'; IMG[n] = im; }
function spr(n, fx, fy, z = 0) { // fx,fy = quina da frente do móvel no chão
  const im = IMG[n], a = ANC[n]; if (!im || !im.complete || !a) return;
  const [x, y] = iso(fx, fy); ctx.drawImage(im, Math.round(x - a[2]), Math.round(y - a[3] - z));
}

let t0 = performance.now(), T = 0;
function cenario() {
  // piso de madeira (tile Kenney)
  const piso = IMG.floorFull_SE;
  for (let x = 0; x < GX; x++) for (let y = 0; y < GY; y++) {
    const [px, py] = iso(x, y);
    if (piso.complete) ctx.drawImage(piso, Math.round(px - 75), Math.round(py));
  }
  // paredes futuristas: azul-marinho com faixas de LED
  quadFundo(0, GX, 0, WH, '#13254b'); quadEsq(0, GY, 0, WH, '#0e1d3d');
  quadFundo(0, GX, WH - 8, WH, '#0a1630'); quadEsq(0, GY, WH - 8, WH, '#081227');
  const led = .65 + Math.sin(T / 700) * .2;
  quadFundo(0, GX, WH - 11, WH - 9, `rgba(0,229,255,${led})`); quadEsq(0, GY, WH - 11, WH - 9, `rgba(0,229,255,${led})`);
  quadFundo(0, GX, 4, 6, `rgba(30,144,255,${led})`); quadEsq(0, GY, 4, 6, `rgba(30,144,255,${led})`);
  // janelões com a cidade à noite (parede esquerda)
  for (const [a, b] of [[.35, 1.55], [1.75, 2.95]]) {
    quadEsq(a, b, 22, 112, '#061026', '#5fb8ff');
    for (let k = 0; k < 18; k++) {
      const gy = a + .08 + (k % 6) * (b - a - .16) / 6, z = 26 + (k * 13 % 40), alt = 18 + (k * 7 % 30);
      quadEsq(gy, gy + .12, 22, z + alt, '#0b1d44');
      if ((k + Math.floor(T / 1500)) % 3) { const p = naParedeEsq(gy + .05, z + alt - 6); R(p[0] - 1, p[1], 2, 3, '#ffe9a8'); }
    }
    quadEsq(a + (b - a) / 2 - .01, a + (b - a) / 2 + .01, 22, 112, '#5fb8ff');
  }
  // letreiro neon XYZ (parede do fundo)
  ctx.save();
  const [lx, ly] = naParedeFundo(1.35, 108);
  ctx.translate(lx, ly); ctx.transform(1, TH / TW, 0, 1, 0, 0);
  ctx.font = '800 34px Inter, sans-serif'; ctx.fillStyle = '#d6efff';
  ctx.shadowColor = '#1e90ff'; ctx.shadowBlur = 16 + Math.sin(T / 400) * 4;
  ctx.fillText('XYZ', 0, 0); ctx.shadowBlur = 6; ctx.fillText('XYZ', 0, 0);
  ctx.font = '700 11px Inter, sans-serif'; ctx.fillStyle = '#8cc8ff'; ctx.fillText('P R O M O T O R A', 2, 15);
  ctx.restore();
  // placa do portal
  quadFundo(5.05, 5.75, 104, 116, '#0b2d6b', '#60a5fa');
  { const p = naParedeFundo(5.12, 107); ctx.save(); ctx.translate(p[0], p[1]); ctx.transform(1, TH / TW, 0, 1, 0, 0); ctx.font = '700 9px Inter, sans-serif'; ctx.fillStyle = '#bfe3ff'; ctx.fillText('PORTAL', 0, 6); ctx.restore(); }
  // quadro de metas (parede do fundo)
  quadFundo(4.0, 4.85, 50, 98, '#f8fafc', '#64748b');
  for (let k = 0; k < 4; k++) quadFundo(4.08, 4.2 + .14 * (k + 1), 60 + k * 9, 65 + k * 9, ['#22c55e', '#1e90ff', '#f59e0b', '#ef4444'][k]);
  // relógio
  { const c = naParedeFundo(3.4, 100); ctx.save(); ctx.translate(c[0], c[1]); ctx.transform(1, TH / TW, 0, 1, 0, 0);
    ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, 7); ctx.fill(); ctx.fillStyle = '#e2e8f0'; ctx.beginPath(); ctx.arc(0, 0, 10, 0, 7); ctx.fill();
    const d = new Date(), hh = (d.getHours() % 12 + d.getMinutes() / 60) / 12 * 6.283, mm = d.getMinutes() / 60 * 6.283;
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(hh) * 5, -Math.cos(hh) * 5); ctx.moveTo(0, 0); ctx.lineTo(Math.sin(mm) * 8, -Math.cos(mm) * 8); ctx.stroke(); ctx.restore(); }
}

/* ---------- peças próprias: aquário futurista, portal, dinheiro ---------- */
const peixes = Array.from({ length: 9 }, (_, i) => ({ u: Math.random(), v: .2 + Math.random() * .6, vel: (.04 + Math.random() * .05) * (i % 2 ? 1 : -1), cor: ['#f97316', '#facc15', '#22d3ee', '#f472b6', '#a3e635'][i % 5], t: 3 + (i % 3) }));
function aquario(gx, gy, sx, sy) {
  caixa(gx, gy, sx, sy, 34, ['#1f2937', '#111827', '#0b1220']); // móvel
  const z0 = 34, h = 62;
  // água (faces translúcidas)
  caixa(gx + .02, gy + .02, sx - .04, sy - .04, h, ['rgba(120,220,255,.35)', 'rgba(20,120,220,.45)', 'rgba(10,90,190,.5)'], z0);
  // areia e plantinhas
  caixa(gx + .03, gy + .03, sx - .06, sy - .06, 6, ['#fde68a', '#d4b062', '#b8954a'], z0);
  for (let k = 0; k < 6; k++) { const p = pontoNaFrente(gx + .1 + k * (sx - .2) / 5, gy + sy - .04, z0 + 6); const alt = 12 + (k * 7 % 14);
    ctx.strokeStyle = k % 2 ? '#22c55e' : '#10b981'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    ctx.quadraticCurveTo(p[0] + Math.sin(T / 500 + k) * 4, p[1] - alt / 2, p[0] + Math.sin(T / 400 + k) * 3, p[1] - alt); ctx.stroke(); }
  // peixes na face da frente
  for (const f of peixes) {
    f.u += f.vel * .016; if (f.u > 1) { f.u = 1; f.vel *= -1; } if (f.u < 0) { f.u = 0; f.vel *= -1; }
    const p = pontoNaFrente(gx + .06 + f.u * (sx - .12), gy + sy - .02, z0 + 10 + f.v * (h - 18));
    const dir = f.vel > 0 ? 1 : -1;
    ctx.fillStyle = f.cor; ctx.beginPath(); ctx.ellipse(p[0], p[1], f.t + 2, f.t * .7, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(p[0] - dir * (f.t + 1), p[1]); ctx.lineTo(p[0] - dir * (f.t + 6), p[1] - 4); ctx.lineTo(p[0] - dir * (f.t + 6), p[1] + 4); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.fillRect(Math.round(p[0] + dir * (f.t - 1)), Math.round(p[1] - 1), 2, 2);
  }
  // bolhas
  for (let k = 0; k < 7; k++) { const y = (T / 18 + k * 23) % (h - 8); const p = pontoNaFrente(gx + .15 + (k * .37 % (sx - .3)), gy + sy - .03, z0 + 8 + y);
    ctx.strokeStyle = 'rgba(220,250,255,.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(p[0], p[1], 1.5 + (k % 3) * .6, 0, 7); ctx.stroke(); }
  // vidro com reflexo + tampa neon
  const r1 = pontoNaFrente(gx + .2, gy + sy, z0 + 8), r2 = pontoNaFrente(gx + .35, gy + sy, z0 + h - 6);
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(...r1); ctx.lineTo(...r2); ctx.stroke();
  caixa(gx - .02, gy - .02, sx + .04, sy + .04, 6, ['#0f172a', '#0b1220', '#070b14'], z0 + h);
  const brilho = .6 + Math.sin(T / 500) * .3;
  caixa(gx + .05, gy + sy - .02, sx - .1, .04, 2, [`rgba(0,229,255,${brilho})`, `rgba(0,229,255,${brilho})`, `rgba(0,229,255,${brilho})`], z0 + h + 1);
  const [cx, cy] = iso(gx + sx / 2, gy + sy); const g = ctx.createRadialGradient(cx, cy - z0 - h / 2, 4, cx, cy - z0 - h / 2, 120);
  g.addColorStop(0, 'rgba(0,200,255,.16)'); g.addColorStop(1, 'rgba(0,200,255,0)'); ctx.fillStyle = g; ctx.fillRect(cx - 120, cy - z0 - h / 2 - 120, 240, 240);
}
function portal(gx, gy) {
  caixa(gx, gy, .55, .55, 8, ['#1e293b', '#0f172a', '#020617']);
  const pulso = .45 + Math.sin(T / 250) * .2;
  caixa(gx + .05, gy + .05, .45, .45, 92, [`rgba(120,200,255,${pulso})`, `rgba(30,144,255,${pulso * .8})`, `rgba(14,90,200,${pulso})`], 8);
  const [x, y] = iso(gx + .275, gy + .275); const gr = ctx.createLinearGradient(0, y - 100, 0, y);
  gr.addColorStop(0, 'rgba(180,230,255,0)'); gr.addColorStop(.5, `rgba(160,220,255,${pulso * .7})`); gr.addColorStop(1, 'rgba(180,230,255,0)');
  ctx.fillStyle = gr; ctx.fillRect(x - 14, y - 100, 28, 96);
  caixa(gx - .03, gy - .03, .61, .61, 10, ['#334155', '#1e293b', '#0f172a'], 100);
  caixa(gx + .18, gy + .18, .2, .2, 3, ['#bfe3ff', '#1e90ff', '#0b5ed7'], 110);

    if (a.balao && a.balao.ate > T) {
      mctx.font = `600 ${Math.max(12, 6 * S)}px Inter, sans-serif`;
      const bw = Math.min(260, mctx.measureText(a.balao.txt).width + 18), bh = Math.max(24, 11 * S), by = Y - bh - 14;
      mctx.fillStyle = '#fff'; mctx.beginPath(); mctx.roundRect(X - bw / 2, by, bw, bh, 10); mctx.fill();
      mctx.beginPath(); mctx.moveTo(X - 6, by + bh); mctx.lineTo(X + 6, by + bh); mctx.lineTo(X, by + bh + 7); mctx.fill();
      mctx.fillStyle = '#0b1530'; mctx.fillText(a.balao.txt.length > 34 ? a.balao.txt.slice(0, 33) + '…' : a.balao.txt, X, by + bh / 2);
    }
  }
  mctx.globalAlpha = 1;
  for (let k = efeitos.length - 1; k >= 0; k--) {
    const e = efeitos[k]; if (e.ate < T) { efeitos.splice(k, 1); continue; }
    const vida = 1 - (e.ate - T) / 2000, [sx, sy] = iso(e.x, e.y);
    mctx.globalAlpha = Math.min(1, (e.ate - T) / 500);
    mctx.font = `${Math.max(14, 8 * S)}px serif`; mctx.textAlign = 'center';
    mctx.fillText(e.emoji, (sx + e.dx * vida) * S, (sy - e.z - e.v * vida * 1.6) * S);
  }
  mctx.globalAlpha = 1;
}

function quadro(agora) {
  const dt = Math.min(.05, (agora - t0) / 1000); t0 = agora; T = agora;
  mover(dt);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, IW, IH);
  cenario();
  const itens = MOVEIS.map(m => ({ d: m.d, f: m.f }));
  atores.forEach(a => itens.push({ d: a.x + a.y + (a.sentado && !a.andando ? .2 : .6), f: () => boneco(a) }));
  itens.sort((a, b) => a.d - b.d).forEach(i => i.f());
  mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.imageSmoothingEnabled = true; mctx.imageSmoothingQuality = 'high';
  mctx.clearRect(0, 0, cv.width, cv.height); mctx.drawImage(off, 0, 0, cv.width, cv.height);
  textos();
  requestAnimationFrame(quadro);
}

/* ---------- lista lateral, relógio ---------- */
function desenharLista() {
  $('#lista').innerHTML = equipe.map(p => {
    const e = estadoDe(p), cls = e === 'mesa' ? 'on' : e === 'almoco' ? 'alm' : '';
    const txt = e === 'mesa' ? 'na mesa' : e === 'almoco' ? 'almoçando' : 'fora';
    return `<div class="pessoa"><i class="${cls}"></i>${esc(p.nome)}${p.papel === 'admin' ? ' 👑' : ''}<small>${txt}</small></div>`;
  }).join('');
}
setInterval(() => { $('#relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); atualizarAtores(); }, 15000);

/* ---------- interações ---------- */
const ACOES = {
  acenar: { emoji: '👋', txt: n => n ? `Oi, ${n}!` : 'Oi, pessoal!' },
  dancar: { emoji: '🎵' }, coracao: { emoji: '❤️' }, highfive: { emoji: '✋' }, cafe: { emoji: '☕', txt: () => 'Bora um café?' }, palmas: { emoji: '👏' },
};
function executar(m) {
  const de = atores.get(m.de), para = m.para ? atores.get(m.para) : null;
  if (!de) return;
  const nomePara = para ? para.p.nome.split(' ')[0] : '';
  if (m.tipo === 'falar') return balao(m.de, m.texto, 5000);
  const a = ACOES[m.tipo]; if (!a) return;
  if (m.tipo === 'acenar') de.acena = T + 2500;
  if (m.tipo === 'dancar') { de.danca = T + 6000; particulas(m.de, '🎵', 5); return; }
  if (m.tipo === 'highfive' && para) { de.acena = T + 2000; para.acena = T + 2000; particulas(m.para, '✋', 3); }
  if (a.txt) balao(m.de, a.txt(nomePara));
  particulas(para && m.tipo !== 'acenar' ? m.para : m.de, a.emoji, m.tipo === 'coracao' ? 8 : 4);
}
function enviar(tipo, para, texto) { XYZPresenca.enviar('acao', { de: eu.id, para: para || null, tipo, texto: texto ? String(texto).slice(0, 80) : undefined }); }

cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(), mx = (e.clientX - r.left) / S, my = (e.clientY - r.top) / S;
  let melhor = null, dmin = 1e9;
  atores.forEach(a => { const [x, y] = iso(a.x, a.y), d = Math.hypot(mx - x, my - (y - 36)); if (d < dmin) { dmin = d; melhor = a; } });
  const m = $('#menu');
  if (!melhor || dmin > 40) { m.hidden = true; return; }
  const eh = melhor.id === eu.id, nome = melhor.p.nome.split(' ')[0];
  const ops = eh ? [['acenar', '👋 Acenar para todos'], ['dancar', '💃 Dançar'], ['cafe', '☕ Chamar pro café'], ['palmas', '👏 Bater palmas']]
                 : [['acenar', `👋 Acenar para ${nome}`], ['highfive', '✋ Toca aqui!'], ['coracao', '❤️ Mandar coração'], ['palmas', '👏 Aplaudir']];
  m.innerHTML = `<b>${esc(melhor.p.nome)}${eh ? ' (você)' : ''}</b>` + ops.map(([k, t]) => `<button data-a="${k}">${t}</button>`).join('') +
    `<form id="f-falar"><input id="i-falar" maxlength="80" placeholder="Dizer algo…"><button class="btn" style="padding:6px 10px">➤</button></form>`;
  m.style.left = Math.min(innerWidth - 190, e.clientX + 8) + 'px'; m.style.top = Math.min(innerHeight - 260, e.clientY + 8) + 'px'; m.hidden = false;
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { enviar(b.dataset.a, eh ? null : melhor.id); m.hidden = true; });
  $('#f-falar').onsubmit = ev => { ev.preventDefault(); const t = $('#i-falar').value.trim(); if (t) enviar('falar', null, t); m.hidden = true; };
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#menu').hidden = true; });

/* ---------- horários (admin) ---------- */
$('#btn-horarios').onclick = () => {
  $('#tb-hor').innerHTML = equipe.map(p => `<tr data-id="${p.id}"><td>${esc(p.nome)}</td>${['entrada', 'almoco_ini', 'almoco_fim', 'saida'].map(c =>
    `<td><input type="time" data-c="${c}" value="${(p[c] || '').slice(0, 5)}"></td>`).join('')}</tr>`).join('');
  $('#modal').hidden = false;
};
$('#hor-fechar').onclick = () => $('#modal').hidden = true;
$('#hor-salvar').onclick = async () => {
  const b = $('#hor-salvar'); b.disabled = true;
  try {
    for (const tr of document.querySelectorAll('#tb-hor tr')) {
      const up = {}; tr.querySelectorAll('input').forEach(i => up[i.dataset.c] = i.value || null);
      const { error } = await sb.from('perfis').update(up).eq('id', tr.dataset.id); if (error) throw error;
    }
    await carregarEquipe(); $('#modal').hidden = true;
  } catch (err) { alert('Não consegui salvar: ' + (err.message || err)); }
  b.disabled = false;
};

/* ---------- metas na mesa ---------- */
let vendasMes = [];
function aplicarMetas() {
  nivelMesa = {};
  vendasMes.forEach(r => { const f = FAIXAS[r.tipo] || FAIXAS.estagiario, nv = f.filter(x => Number(r.vendas) >= x).length; if (mesaDe[r.id] != null) nivelMesa[mesaDe[r.id]] = nv; });
}
async function carregarMetas() {
  const hoje = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
  const [y, m] = hoje.split('-').map(Number), ini = `${y}-${String(m).padStart(2, '0')}-01`;
  const fim = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
  const { data } = await sb.rpc('metas_mes', { inicio: ini, fim });
  if (data) { vendasMes = data; aplicarMetas(); }
}
setInterval(carregarMetas, 60000);

/* ---------- início ---------- */
async function carregarEquipe() {
  const { data, error } = await sb.rpc('equipe_escritorio');
  if (!error && data) { equipe = data; atualizarAtores(); }
}
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return location.href = './';
  const { data: perfil } = await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle();
  if (!perfil || !perfil.ativo) return location.href = './';
  eu = perfil;
  $('#btn-horarios').hidden = eu.papel !== 'admin';
  $('#relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  XYZPresenca.entrar(sb, eu, {
    sync: st => { online = new Set(Object.keys(st)); syncOk = true; atualizarAtores(); },
    acao: executar,
    venda: m => { setTimeout(carregarMetas, 800); balao(m.id, '🎉 Fechei mais um!', 4000); particulas(m.id, '🎉', 6); particulas(m.id, '💰', 4); const a = atores.get(m.id); if (a) a.danca = T + 3000; },
  });
  await carregarEquipe(); await carregarMetas();
  requestAnimationFrame(quadro);
})();
</script>
