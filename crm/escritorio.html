<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Escritório virtual | XYZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060f;--borda:rgba(30,144,255,.28);--texto:#eaf3ff;--suave:#93a9c9;--azul:#1e90ff;--azul2:#8cc8ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--texto);font-family:Inter,system-ui,sans-serif;overflow:hidden}
[hidden]{display:none!important}
header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(2,6,15,.75);backdrop-filter:blur(10px);border-bottom:1px solid var(--borda)}
header h1{font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:1px;color:var(--azul2);text-shadow:0 0 12px rgba(30,144,255,.8)}
header .esp{flex:1}
.btn{background:linear-gradient(135deg,#0052ff,#1e90ff 55%,#00b8ff);border:0;border-radius:10px;padding:9px 14px;font-weight:700;color:#fff;cursor:pointer;font:inherit;font-size:13px;text-decoration:none;white-space:nowrap}
.btn.sec{background:rgba(9,24,56,.85);border:1px solid var(--borda)}
#relogio{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--suave)}
#palco{position:fixed;left:0;right:0;top:56px;bottom:0;background:radial-gradient(ellipse at 50% 45%,#0a2350,#02060f 70%)}
#palco canvas{position:absolute;left:0;top:0;display:block}
#hud{pointer-events:none}
#lado{position:fixed;left:14px;bottom:14px;z-index:4;width:230px;background:rgba(3,10,26,.82);border:1px solid var(--borda);border-radius:14px;padding:12px;backdrop-filter:blur(10px)}
#lado h3{font-size:12px;color:var(--suave);margin-bottom:8px;font-weight:600}
.pessoa{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.pessoa i{width:9px;height:9px;border-radius:50%;background:#475569;flex:none}
.pessoa i.on{background:#22c55e;box-shadow:0 0 8px #22c55e}
.pessoa i.alm{background:#f59e0b;box-shadow:0 0 8px #f59e0b}
.pessoa small{margin-left:auto;color:var(--suave);font-size:11px}
#menu{position:fixed;z-index:8;background:rgba(3,10,26,.95);border:1px solid var(--borda);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:170px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#menu b{font-size:12px;color:var(--azul2);padding:2px 6px 6px}
#menu button{background:none;border:0;color:var(--texto);text-align:left;padding:7px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
#menu button:hover{background:rgba(30,144,255,.15)}
#menu form{display:flex;gap:4px;padding:4px 2px 0}
#menu input{flex:1;min-width:0;background:rgba(9,24,56,.85);border:1px solid var(--borda);border-radius:8px;padding:6px 8px;color:var(--texto);font:inherit;font-size:13px}
#foto-hover{position:fixed;z-index:9;pointer-events:none;background:rgba(3,10,26,.95);border:1px solid rgba(0,229,255,.5);border-radius:16px;padding:10px;text-align:center;box-shadow:0 0 30px rgba(30,144,255,.45);transform:translate(-50%,-100%)}
#foto-hover img{width:150px;height:150px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 8px;box-shadow:0 0 18px rgba(30,144,255,.6)}
#foto-hover b{display:block;font-size:14px}#foto-hover small{color:var(--suave);font-size:12px}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
#modal .caixa{background:rgba(3,10,26,.97);border:1px solid var(--borda);border-radius:16px;padding:20px;width:100%;max-width:640px;max-height:90vh;overflow:auto}
#modal h3{margin-bottom:4px}
#modal p{color:var(--suave);font-size:13px;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--suave);font-weight:600;font-size:11px;padding:6px 4px}
td{padding:5px 4px}
td input{width:100%;background:rgba(9,24,56,.85);border:1px solid var(--borda);border-radius:8px;padding:6px;color:var(--texto);font:inherit;font-size:13px;color-scheme:dark}
#dica{position:fixed;right:14px;bottom:14px;z-index:4;font-size:12px;color:var(--suave);background:rgba(3,10,26,.8);border:1px solid var(--borda);border-radius:10px;padding:8px 12px}
@media (max-width:760px){#lado{width:auto;right:14px;bottom:10px;max-height:28vh;overflow:auto}#dica{display:none}header h1{font-size:10px}#relogio{display:none}}

/* ---------- missão diária: estilo quest (WoW futurista) ---------- */
#quest-btn{position:fixed;left:18px;top:74px;z-index:6;width:44px;height:44px;border:0;background:none;cursor:pointer;padding:0}
#quest-btn .hex{position:absolute;inset:0;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(160deg,#fde68a,#f59e0b 45%,#b45309);box-shadow:0 0 18px rgba(251,191,36,.7)}
#quest-btn .hex::after{content:"";position:absolute;inset:3px;clip-path:inherit;background:radial-gradient(circle at 50% 30%,#0b2a5c,#050d22 70%)}
#quest-btn b{position:relative;z-index:1;display:block;text-align:center;font:900 24px/44px Inter,sans-serif;color:#fde047;text-shadow:0 0 10px #fbbf24}
#quest-btn.feita b{color:#4ade80;text-shadow:0 0 10px #22c55e}
#quest{position:fixed;inset:0;z-index:12;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at center,rgba(0,40,90,.35),rgba(0,0,0,.75))}
#quest .q{position:relative;width:100%;max-width:440px;padding:26px 26px 20px;background:linear-gradient(180deg,rgba(6,18,46,.97),rgba(2,8,22,.98));border:1px solid rgba(251,191,36,.55);border-radius:6px;box-shadow:0 0 0 4px rgba(2,8,22,.9),0 0 0 5px rgba(251,191,36,.35),0 0 40px rgba(30,144,255,.35),inset 0 0 40px rgba(30,144,255,.08);animation:questEntra .45s cubic-bezier(.2,.9,.2,1.2)}
#quest .q::before,#quest .q::after{content:"";position:absolute;width:26px;height:26px;border:2px solid #fbbf24;filter:drop-shadow(0 0 6px #fbbf24)}
#quest .q::before{top:-6px;left:-6px;border-right:0;border-bottom:0}
#quest .q::after{bottom:-6px;right:-6px;border-left:0;border-top:0}
#quest .selo{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:56px;height:56px;clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);background:linear-gradient(160deg,#fde68a,#f59e0b 45%,#b45309);display:flex;align-items:center;justify-content:center}
#quest .selo span{width:48px;height:48px;clip-path:inherit;background:radial-gradient(circle at 50% 30%,#0b2a5c,#050d22 70%);display:flex;align-items:center;justify-content:center;font:900 28px Inter,sans-serif;color:#fde047;text-shadow:0 0 12px #fbbf24}
#quest .tipo{text-align:center;font-size:10px;letter-spacing:3px;color:#7dd3fc;margin-top:14px;text-transform:uppercase}
#quest h2{text-align:center;font:800 22px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;margin:4px 0 12px;background:linear-gradient(90deg,#f59e0b,#fde68a,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(251,191,36,.45))}
#quest .desc{font-size:14px;line-height:1.5;color:#cfe3ff;text-align:center;margin-bottom:16px}
#quest h4{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#fbbf24;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
#quest h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(251,191,36,.5),transparent)}
#quest .obj{display:flex;justify-content:space-between;font-size:13px;margin:8px 0 4px;color:#e6f0ff}
#quest .obj.ok{color:#4ade80}
#quest .barra{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(125,211,252,.2)}
#quest .barra i{display:block;height:100%;background:linear-gradient(90deg,#0066ff,#00c2ff);box-shadow:0 0 12px rgba(0,194,255,.7);transition:width 1s}
#quest .obj.ok + .barra i{background:linear-gradient(90deg,#16a34a,#4ade80)}
#quest .recomp{display:flex;align-items:center;gap:14px;padding:12px;border-radius:6px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.3)}
#quest .recomp .ic{width:46px;height:46px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;background:radial-gradient(circle,#3a2a05,#0b0b12);border:1px solid #fbbf24;box-shadow:0 0 14px rgba(251,191,36,.45)}
#quest .recomp b{font-size:20px;color:#fde68a}
#quest .recomp small{display:block;color:var(--suave);font-size:11px}
#quest .acoes{display:flex;gap:10px;justify-content:center;margin-top:18px}
#quest .acoes button{font:700 13px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:10px 22px;border-radius:4px;cursor:pointer;border:1px solid #fbbf24;background:linear-gradient(180deg,#b45309,#78350f);color:#fff7d6;box-shadow:0 0 14px rgba(251,191,36,.35)}
#quest .acoes button.sec{background:transparent;border-color:rgba(125,211,252,.4);color:#cfe3ff;box-shadow:none}
#quest .completa{text-align:center;font:800 14px Inter,sans-serif;letter-spacing:2px;color:#4ade80;text-shadow:0 0 12px #22c55e;margin-top:12px}
@keyframes questEntra{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header>
  <a class="btn sec" href="./">← CRM</a>
  <h1>ESCRITÓRIO XYZ</h1>
  <div class="esp"></div>
  <span id="relogio"></span>
  <button class="btn sec" id="btn-horarios" hidden>⏰ Horários</button>
</header>
<div id="palco"><canvas id="cv"></canvas><canvas id="hud"></canvas></div>
<div id="lado"><h3>Equipe agora</h3><div id="lista"></div></div>
<div id="dica">Clique em alguém para interagir 👋 · role para dar zoom <span style="opacity:.5;margin-left:8px">móveis: Kenney.nl (CC0)</span></div>
<div id="menu" hidden></div>
<div id="foto-hover" hidden><img alt=""><b></b><small></small></div>
<div id="modal" hidden>
  <div class="caixa">
    <h3>⏰ Horários da equipe</h3>
    <p>No horário de almoço o bonequinho vai para a cozinha; depois da saída, vai embora pela porta.</p>
    <table><thead><tr><th>Nome</th><th>Entrada</th><th>Almoço início</th><th>Almoço fim</th><th>Saída</th></tr></thead><tbody id="tb-hor"></tbody></table>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn sec" id="hor-fechar">Fechar</button><button class="btn" id="hor-salvar">Salvar horários</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="presenca.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
const CFG = window.CRM_CONFIG;
const sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let eu = null, equipe = [], online = new Set();

/* ================== CENA 3D (three.js + móveis Kenney CC0) ================== */
const U = 10;                       // 1 "tile" lógico = 10 unidades Kenney ≈ 2 m
const GX = 7, GY = 6, ALT_PAREDE = 12.9;
const palco = $('#palco'), gl = $('#cv'), cv = $('#hud'), mctx = cv.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .95;
const scene = new THREE.Scene();
const VIPX = 1;                     // largura do hall dos advogados (à direita)
const centro = new THREE.Vector3((GX + VIPX * .5) * U / 2, 0, GY * U / 2);
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 1000);
camera.position.set(centro.x + 100, 92, centro.z + 100); camera.lookAt(centro.x, 8, centro.z);
let S = 1, LARG = 1, ALT = 1, ZOOM = 1;
function ajustar() {
  LARG = innerWidth; ALT = innerHeight - 56;
  renderer.setSize(LARG, ALT); cv.width = LARG; cv.height = ALT;
  const meia = 40, asp = LARG / ALT;
  camera.left = -meia * asp / ZOOM; camera.right = meia * asp / ZOOM; camera.top = meia / ZOOM; camera.bottom = -meia / ZOOM;
  camera.updateProjectionMatrix();
}
addEventListener('resize', ajustar); ajustar();
gl.addEventListener('wheel', e => { e.preventDefault(); ZOOM = Math.min(2.2, Math.max(.7, ZOOM * (e.deltaY < 0 ? 1.08 : .93))); ajustar(); }, { passive: false });

// luzes
scene.add(new THREE.HemisphereLight(0xe6f0ff, 0x0b0f18, .8));
const sol = new THREE.DirectionalLight(0xeef4ff, 1.3);
sol.position.set(centro.x + 40, 90, centro.z + 60); sol.target.position.copy(centro);
sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -60, right: 60, top: 60, bottom: -60, near: 1, far: 250 });
sol.shadow.bias = -.0008; scene.add(sol, sol.target);

const W = (x, z, y = 0) => new THREE.Vector3(x * U, y, z * U); // lógico -> mundo

/* ---------- carregar modelos ---------- */
const modelos = {};
function carregar(nome) { return modelos[nome] || (modelos[nome] = carregarModelo(nome)); }
async function carregarModelo(nome) {
  // um carregador por modelo: evita misturar os materiais de um móvel com outro
  const mat = await new MTLLoader().setPath('modelos/').loadAsync(nome + '.mtl'); mat.preload();
  const obj = await new OBJLoader().setMaterials(mat).setPath('modelos/').loadAsync(nome + '.obj');
  obj.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true;
    const ms = Array.isArray(m.material) ? m.material : [m.material];
    const novos = ms.map(x => { const k = new THREE.MeshStandardMaterial({ color: x.color, roughness: .7, metalness: /metal/i.test(x.name) ? .5 : 0, name: x.name, side: THREE.DoubleSide });
      if (/glass/i.test(x.name)) { k.transparent = true; k.opacity = .35; k.roughness = .05; }
      // visual NY futurista: madeira/marrom vira laca branca (claros) ou grafite (escuros)
      const hsl = {}; k.color.getHSL(hsl);
      if (!/glass|metal/i.test(x.name) && hsl.h > .02 && hsl.h < .15 && hsl.s > .18 && hsl.l > .12 && hsl.l < .8) {
        if (hsl.l > .38) { k.color.set('#e9edf3'); k.roughness = .28; k.metalness = .05; } else { k.color.set('#161a22'); k.roughness = .4; k.metalness = .25; }
      }
      return k; });
    m.material = Array.isArray(m.material) ? novos : novos[0]; } });
  const box = new THREE.Box3().setFromObject(obj), c = box.getCenter(new THREE.Vector3());
  obj.position.set(-c.x, -box.min.y, -c.z);
  const g = new THREE.Group(); g.add(obj); g.userData.tam = box.getSize(new THREE.Vector3());
  return g;
}
async function por(nome, x, z, rot = 0, opc = {}) { // x,z = centro em tiles; rot em graus
  const g = (await carregar(nome)).clone(true);
  g.position.copy(W(x, z, opc.y || 0)); g.rotation.y = rot * Math.PI / 180;
  if (opc.cor) g.traverse(m => { if (m.isMesh) { m.material = (Array.isArray(m.material) ? m.material : [m.material]).map(x => { const k = x.clone(); if (!opc.so || opc.so.test(x.name)) k.color = new THREE.Color(opc.cor); return k; }); if (m.material.length === 1) m.material = m.material[0]; } });
  scene.add(g); return g;
}
const caixa3 = (sx, sy, sz, cor, x, y, z, extra = {}) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshStandardMaterial({ color: cor, roughness: .6, ...extra }));
  m.position.set(x, y + sy / 2, z); m.castShadow = !extra.transparent; m.receiveShadow = true; scene.add(m); return m;
};
function texturaTexto(txt, w, h, fonte, cor, brilho) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
  g.font = fonte; g.textAlign = 'center'; g.textBaseline = 'middle'; g.shadowColor = brilho; g.shadowBlur = 24; g.fillStyle = cor;
  txt.split('\n').forEach((l, i, a) => { g.fillText(l, w / 2, h / 2 + (i - (a.length - 1) / 2) * h / (a.length + .4)); g.shadowBlur = 8; g.fillText(l, w / 2, h / 2 + (i - (a.length - 1) / 2) * h / (a.length + .4)); });
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ---------- ambiente ---------- */
const animados = [];
async function montarAmbiente() {
  // piso: carpete preto em placas (estilo escritório de NY) + passarela preta polida com LED
  const cp = document.createElement('canvas'); cp.width = cp.height = 512; const cg = cp.getContext('2d');
  cg.fillStyle = '#0b0d12'; cg.fillRect(0, 0, 512, 512);
  const img = cg.getImageData(0, 0, 512, 512); for (let k = 0; k < img.data.length; k += 4) { const n = (Math.random() * 14) | 0; img.data[k] += n; img.data[k + 1] += n; img.data[k + 2] += n + 2; } cg.putImageData(img, 0, 0);
  cg.strokeStyle = 'rgba(120,160,220,.10)'; cg.lineWidth = 2; for (let k = 0; k <= 512; k += 128) { cg.beginPath(); cg.moveTo(k, 0); cg.lineTo(k, 512); cg.stroke(); cg.beginPath(); cg.moveTo(0, k); cg.lineTo(512, k); cg.stroke(); }
  const carp = new THREE.CanvasTexture(cp); carp.colorSpace = THREE.SRGBColorSpace; carp.wrapS = carp.wrapT = THREE.RepeatWrapping; carp.repeat.set(GX * 1.5, GY * 1.5); carp.anisotropy = 4;
  const chao = new THREE.Mesh(new THREE.PlaneGeometry(GX * U, GY * U), new THREE.MeshStandardMaterial({ map: carp, roughness: .95, metalness: 0 }));
  chao.rotation.x = -Math.PI / 2; chao.position.set(GX * U / 2, .01, GY * U / 2); chao.receiveShadow = true; scene.add(chao);
  const pass = new THREE.Mesh(new THREE.PlaneGeometry(GX * U, 7), new THREE.MeshStandardMaterial({ color: '#05070b', roughness: .12, metalness: .6 }));
  pass.rotation.x = -Math.PI / 2; pass.position.set(GX * U / 2, .03, CORREDOR * U); pass.receiveShadow = true; scene.add(pass);
  for (const dz of [-3.6, 3.6]) { const l = caixa3(GX * U, .05, .18, '#00e5ff', GX * U / 2, .02, CORREDOR * U + dz, { emissive: '#00e5ff', emissiveIntensity: 1.6 }); animados.push(t => l.material.emissiveIntensity = 1.2 + Math.sin(t / 900) * .5); }
  // paredes azul-marinho (fundo e esquerda), com janelões na esquerda
  for (let x = 0; x < GX; x++) por('wall', x + .5, -.025, 0, { cor: '#0e121a' });
  for (let z = 0; z < GY; z++) por(z === 1 || z === 2 ? 'wallWindow' : 'wall', -.025, z + .5, 90, { cor: '#0e121a', so: /^(?!.*glass)/i });
  // faixas de LED
  const led = (x, y, z, sx, sz) => { const m = caixa3(sx, .25, sz, '#00e5ff', x, y, z, { emissive: '#00e5ff', emissiveIntensity: 2.2 }); animados.push(t => m.material.emissiveIntensity = 1.6 + Math.sin(t / 700) * .6); };
  led(GX * U / 2, ALT_PAREDE - .6, .45, GX * U, .15); led(.45, ALT_PAREDE - .6, GY * U / 2, .15, GY * U);
  led(GX * U / 2, .4, .45, GX * U, .15); led(.45, .4, GY * U / 2, .15, GY * U);
  // cidade lá fora (atrás dos janelões)
  const ct = document.createElement('canvas'); ct.width = 512; ct.height = 256; const g = ct.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#020617'); gr.addColorStop(1, '#0b2d6b'); g.fillStyle = gr; g.fillRect(0, 0, 512, 256);
  for (let k = 0; k < 55; k++) { const w = 12 + Math.random() * 28, h = 60 + Math.random() * 185, x = Math.random() * 512; g.fillStyle = k % 3 ? '#060d22' : '#0a1530'; g.fillRect(x, 256 - h, w, h);

/* ---------- bonecos voxel 3D (arte própria XYZ) ---------- */
const AV_ALT = 9.8, SENTA = -1.0;
const geoCache = new Map();
const caixaGeo = (w, h, d) => { const k = w + '|' + h + '|' + d; if (!geoCache.has(k)) geoCache.set(k, new THREE.BoxGeometry(w, h, d)); return geoCache.get(k); };
function bloco(pai, w, h, d, cor, x, y, z, mats) {
  const m = new THREE.Mesh(caixaGeo(w, h, d), mats.get(cor)); m.position.set(x, y, z); m.castShadow = true; pai.add(m); return m;
}
function criarVoxel(v) {
  const mats = new Map(), cache = cor => { if (!mats.has(cor)) mats.set(cor, new THREE.MeshStandardMaterial({ color: cor, roughness: .75, transparent: true })); return mats.get(cor); };
  const M = { get: cache };

  const pele = v.pele, cab = v.cab, cabC = tom(cab, .08), rou = v.rou, rouE = tom(rou, -.08), calca = '#2c3650', sapato = '#16181d';
  const raiz = new THREE.Group(), corpo = new THREE.Group(); raiz.add(corpo);
  // pernas (coxa + canela com joelho), quadril em y=3.6
  const perna = lado => {
    const coxa = new THREE.Group(); coxa.position.set(lado * .62, 3.6, 0); corpo.add(coxa);
    bloco(coxa, 1.1, 1.9, 1.15, calca, 0, -.95, 0, M);
    const canela = new THREE.Group(); canela.position.set(0, -1.9, 0); coxa.add(canela);
    bloco(canela, 1.05, 1.35, 1.1, calca, 0, -.68, 0, M);
    bloco(canela, 1.15, .45, 1.5, sapato, 0, -1.48, .18, M);
    return { coxa, canela };
  };
  const pe = perna(-1), pd = perna(1);
  // tronco
  const tronco = new THREE.Group(); tronco.position.y = 3.6; corpo.add(tronco);
  bloco(tronco, 2.7, 3.0, 1.55, rou, 0, 1.5, 0, M);
  if (v.gravata) { bloco(tronco, .9, 2.5, .05, '#f8fafc', 0, 1.65, .79, M); bloco(tronco, .35, 2.1, .08, '#dc2626', 0, 1.6, .82, M); bloco(tronco, .9, .2, .1, '#0b2d6b', 0, 2.9, .8, M); }
  else if (rou === '#1e3a8a') { bloco(tronco, .12, 2.8, .06, '#0b1840', 0, 1.5, .8, M); bloco(tronco, 2.75, .45, 1.6, rouE, 0, 2.85, 0, M); }
  else bloco(tronco, 1.0, .25, .06, tom(pele, -.06), 0, 2.88, .79, M);
  // braços (pivô no ombro)
  const braco = lado => {
    const g = new THREE.Group(); g.position.set(lado * 1.75, 6.35, 0); corpo.add(g);
    bloco(g, .8, 2.4, .9, rou, 0, -1.2, 0, M); bloco(g, .78, .6, .85, pele, 0, -2.7, 0, M);
    return g;
  };
  const be = braco(-1), bd = braco(1);
  // cabeça
  const cabeca = new THREE.Group(); cabeca.position.y = 6.65; corpo.add(cabeca);
  bloco(cabeca, .9, .35, .9, tom(pele, -.06), 0, .1, 0, M); // pescoço
  bloco(cabeca, 2.7, 2.6, 2.45, pele, 0, 1.55, 0, M);
  bloco(cabeca, .42, .55, .06, '#ffffff', -.6, 1.6, 1.24, M); bloco(cabeca, .42, .55, .06, '#ffffff', .6, 1.6, 1.24, M);
  bloco(cabeca, .26, .4, .08, '#111827', -.55, 1.55, 1.27, M); bloco(cabeca, .26, .4, .08, '#111827', .65, 1.55, 1.27, M);
  bloco(cabeca, .8, .16, .06, tom(pele, -.25), 0, .85, 1.24, M); // boca
  bloco(cabeca, .38, .18, .05, tom(pele, -.12), -.95, 1.1, 1.23, M); bloco(cabeca, .38, .18, .05, tom(pele, -.12), .95, 1.1, 1.23, M); // bochechas
  bloco(cabeca, .2, .5, .5, tom(pele, -.05), -1.4, 1.4, 0, M); bloco(cabeca, .2, .5, .5, tom(pele, -.05), 1.4, 1.4, 0, M); // orelhas
  const H = (w, h, d, x, y, z, c = cab) => bloco(cabeca, w, h, d, c, x, y, z, M);
  switch (v.est) {
    case 'curto': H(2.85, .6, 2.6, 0, 3.0, -.02); H(2.85, 1.3, .4, 0, 2.3, -1.15); H(.3, .9, 2.0, -1.38, 2.45, -.2); H(.3, .9, 2.0, 1.38, 2.45, -.2); H(1.4, .15, .3, -.3, 3.32, .5, cabC); break;
    case 'bagunca':
      H(2.95, .8, 2.7, 0, 3.05, -.05); H(2.95, 1.9, .45, 0, 2.1, -1.2); H(.35, 1.6, 2.4, -1.45, 2.2, -.1); H(.35, 1.6, 2.4, 1.45, 2.2, -.1);
      for (const [x, z, h] of [[-.9, .5, .7], [.1, .9, .6], [.9, .3, .8], [-.4, -.6, .9], [.6, -.8, .7]]) H(.7, h, .7, x, 3.4 + h / 2, z);

    case 'longo':

      H(1.3, .45, .25, -.65, 2.6, 1.2); H(.9, .3, .25, .85, 2.72, 1.2); H(1.2, .12, .3, -.5, 3.36, .4, cabC); break;
    case 'franja':
      H(2.95, .7, 2.65, 0, 3.0, -.03); H(2.95, 4.2, .5, 0, .9, -1.2); H(.4, 3.8, 1.7, -1.47, 1.1, -.3); H(.4, 3.8, 1.7, 1.47, 1.1, -.3);
      H(2.8, .65, .25, 0, 2.45, 1.22); H(1.0, .12, .3, .5, 3.36, .4, cabC); break;
    case 'cacho':
      for (const [x, y, z] of [[-1, 3.1, .6], [0, 3.35, .7], [1, 3.1, .5], [-1.2, 3.2, -.5], [0, 3.45, -.4], [1.2, 3.2, -.6], [-1.65, 2.4, .3], [1.65, 2.4, .2], [-1.7, 1.5, -.3], [1.7, 1.5, -.4], [-1.6, .6, -.6], [1.6, .6, -.7], [0, 2.6, -1.4], [-.9, 1.6, -1.5], [.9, 1.6, -1.5], [0, .7, -1.5], [-1.4, 2.9, -1.0], [1.4, 2.9, -1.0]])
        H(1.05, 1.05, 1.05, x, y, z, (x + y + z) % 2 > 1 ? cabC : cab);
      H(2.4, .5, .3, 0, 2.75, 1.1); break;
  }
  raiz.traverse(o => { if (o.isMesh) o.castShadow = true; });

                 : [['acenar', `👋 Acenar para ${nome}`], ['highfive', '✋ Toca aqui!'], ['coracao', '❤️ Mandar coração'], ['palmas', '👏 Aplaudir']];
  m.innerHTML = `<b>${esc(melhor.p.papel === 'advogado' ? nomeExib(melhor.p) : melhor.p.nome)}${eh ? ' (você)' : ''}</b>` + ops.map(([k, t]) => `<button data-a="${k}">${t}</button>`).join('') +
    `<form id="f-falar"><input id="i-falar" maxlength="80" placeholder="Dizer algo…"><button class="btn" style="padding:6px 10px">➤</button></form>`;
  m.style.left = Math.min(innerWidth - 190, e.clientX + 8) + 'px'; m.style.top = Math.min(innerHeight - 260, e.clientY + 8) + 'px'; m.hidden = false;
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { enviar(b.dataset.a, eh ? null : melhor.id); m.hidden = true; });
  $('#f-falar').onsubmit = ev => { ev.preventDefault(); const t = $('#i-falar').value.trim(); if (t) enviar('falar', null, t); m.hidden = true; };
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#menu').hidden = true; });
gl.addEventListener('mousemove', e => {
  const r = gl.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, card = $('#foto-hover');
  let alvo = null;
  atores.forEach(a => { const [X, Y] = cabecaDe(a); if (Math.abs(mx - X) < 45 && my > Y - 26 && my < Y + 4) alvo = a; });
  if (!alvo || !alvo.p.foto_url) { card.hidden = true; gl.style.cursor = alvo ? 'pointer' : ''; return; }
  const [X, Y] = cabecaDe(alvo);
  card.querySelector('img').src = alvo.p.foto_url; card.querySelector('b').textContent = alvo.p.papel === 'advogado' ? nomeExib(alvo.p) : alvo.p.nome;
  card.querySelector('small').textContent = alvo.p.papel === 'advogado' ? 'advogado parceiro · no hall' : alvo.est === 'almoco' ? 'almoçando' : alvo.p.papel === 'admin' ? 'diretoria' : 'na mesa';
  card.style.left = (r.left + X) + 'px'; card.style.top = (r.top + Y - 30) + 'px'; card.hidden = false; gl.style.cursor = 'pointer';
});
gl.addEventListener('mouseleave', () => $('#foto-hover').hidden = true);

/* ---------- horários (admin) ---------- */
$('#btn-horarios').onclick = () => {
  $('#tb-hor').innerHTML = equipe.filter(p => p.papel !== 'advogado').map(p => `<tr data-id="${p.id}"><td>${esc(p.nome)}</td>${['entrada', 'almoco_ini', 'almoco_fim', 'saida'].map(c =>
    `<td><input type="time" data-c="${c}" value="${(p[c] || '').slice(0, 5)}"></td>`).join('')}</tr>`).join('');
  $('#modal').hidden = false;
};
$('#hor-fechar').onclick = () => $('#modal').hidden = true;
$('#hor-salvar').onclick = async () => {
  const b = $('#hor-salvar'); b.disabled = true;
  try {
    for (const tr of document.querySelectorAll('#tb-hor tr')) {
      const up = {}; tr.querySelectorAll('input').forEach(i => up[i.dataset.c] = i.value || null);
      const { error } = await sb.from('perfis').update(up).eq('id', tr.dataset.id); if (error) throw error;
    }
    await carregarEquipe(); $('#modal').hidden = true;
  } catch (err) { alert('Não consegui salvar: ' + (err.message || err)); }
  b.disabled = false;
};

/* ---------- metas na mesa ---------- */
let vendasMes = [];
function aplicarMetas() {
  nivelMesa = {};
  vendasMes.forEach(r => { const f = FAIXAS[r.tipo] || FAIXAS.estagiario, nv = f.filter(x => Number(r.vendas) >= x).length; if (mesaDe[r.id] != null) nivelMesa[mesaDe[r.id]] = nv; });
}
async function carregarMetas() {
  const hoje = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
  const [y, m] = hoje.split('-').map(Number), ini = `${y}-${String(m).padStart(2, '0')}-01`;
  const fim = new Date(Date.UTC(y, m, 0)).toISOString().slice(0, 10);
  const { data } = await sb.rpc('metas_mes', { inicio: ini, fim });
  if (data) { vendasMes = data; aplicarMetas(); atualizarDinheiro(); }
}
setInterval(carregarMetas, 60000);


/* ---------- missões diárias ---------- */
const diaSP = () => (location.search.match(/dia=(\d{4}-\d{2}-\d{2})/) || [])[1] || new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
const brlM = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
let missoes = [], marcaMissao = [], animMissao = [], abriuMissao = false;
const animar = f => { animados.push(f); animMissao.push(f); };
function abrirMissao() {
  const meus = missoes.filter(r => r.atendente_id === eu.id), ref = meus[0] || missoes[0]; if (!ref) return;
  const sg = meus[0]?.seguros || 0, rv = meus[0]?.revisionais || 0, mg = meus[0]?.margens || 0, feita = meus.length && meus[0].cumpriu;
  const obj = (nome, n, meta) => meta ? `<div class="obj ${n >= meta ? 'ok' : ''}"><span>${n >= meta ? '✔' : '◇'} ${nome}</span><b>${Math.min(n, meta)}/${meta}</b></div><div class="barra"><i style="width:${Math.min(100, n / meta * 100)}%"></i></div>` : '';
  const q = $('#quest'); q.hidden = false;
  q.innerHTML = `<div class="q"><div class="selo"><span>${feita ? '✓' : '!'}</span></div>
    <div class="tipo">Missão diária · ${new Date(diaSP() + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: '2-digit' })}${/teste=1/.test(location.search) ? ' · PRÉVIA' : ''}</div>
    <h2>${esc(ref.titulo)}</h2><div class="desc">${esc(ref.descricao || '')}</div>
    ${eu.papel === 'atendente' ? `<h4>Objetivos</h4>${obj('Seguros prestamistas fechados', sg, ref.meta_seguro)}${obj('Revisionais fechados', rv, ref.meta_revisional)}${obj('Aumentos de margem fechados', mg, ref.meta_margem)}`
      : `<h4>Equipe</h4>${missoes.map(r => `<div class="obj ${r.cumpriu ? 'ok' : ''}"><span>${r.cumpriu ? '✔' : '◇'} ${esc(r.atendente)}</span><b>${r.seguros}/${r.meta_seguro} · ${r.revisionais}/${r.meta_revisional}${r.meta_margem ? ' · ' + r.margens + '/' + r.meta_margem : ''}</b></div>`).join('')}`}
    <h4>Recompensa</h4><div class="recomp"><div class="ic">💰</div><div><b>${brlM(ref.recompensa)}</b><small>paga junto com a premiação da meta · aparece na sua mesa ao concluir</small></div></div>
    ${feita ? '<div class="completa">✦ MISSÃO CUMPRIDA ✦</div>' : ''}
    <div class="acoes">${feita || eu.papel !== 'atendente' ? '<button data-q="fechar">Fechar</button>' : '<button data-q="aceitar">Aceitar missão</button><button class="sec" data-q="fechar">Depois</button>'}</div></div>`;
  q.onclick = e => { const b = e.target.closest('[data-q]'); if (b || e.target === q) { q.hidden = true; if (b?.dataset.q === 'aceitar') { try { localStorage.setItem('crm-missao-aceita-' + eu.id + '-' + diaSP(), '1'); } catch (_) {} balao(eu.id, '📜 Missão aceita!', 3000); particulas(eu.id, '✨', 8); } } };
}
function marcadoresMissao() {
  marcaMissao.forEach(m => scene.remove(m)); marcaMissao.length = 0;
  animMissao.forEach(f => { const k = animados.indexOf(f); if (k >= 0) animados.splice(k, 1); }); animMissao.length = 0;
  if (!missoes.length) return;
  // "!" de quest sobre o MEU computador (ou ✓ se cumpri)
  const meu = missoes.find(r => r.atendente_id === eu.id), idx = mesaDe[eu.id];
  if (meu && idx != null) {
    const [x, z] = DESKS[idx];
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturaTexto(meu.cumpriu ? '✓' : '!', 64, 64, '900 56px Inter, sans-serif', meu.cumpriu ? '#4ade80' : '#fde047', meu.cumpriu ? '#14532d' : '#b45309'), transparent: true, depthTest: false }));
    sp.scale.set(2.4, 2.4, 1); sp.position.set(x * U, 10.5, z * U); scene.add(sp); marcaMissao.push(sp);
    animar(t => { sp.position.y = 10.5 + Math.sin(t / 260) * .45; });
  }
  // recompensa na mesa de quem cumpriu: maleta dourada + "+R$" flutuando
  missoes.filter(r => r.cumpriu).forEach(r => {
    const i = mesaDe[r.atendente_id]; if (i == null) return; const [x, z] = DESKS[i];
    const mala = new THREE.Mesh(new THREE.BoxGeometry(1.5, .9, .5), new THREE.MeshStandardMaterial({ color: '#fbbf24', metalness: .85, roughness: .25, emissive: '#7c4a03', emissiveIntensity: .35 }));
    mala.position.set(x * U - 2.3, 3.85 + .45, z * U + .3); scene.add(mala); marcaMissao.push(mala);
    const alca = new THREE.Mesh(new THREE.TorusGeometry(.28, .06, 8, 16, Math.PI), new THREE.MeshStandardMaterial({ color: '#78350f' }));
    alca.position.set(x * U - 2.3, 3.85 + .9, z * U + .3); scene.add(alca); marcaMissao.push(alca);
    const txt = new THREE.Sprite(new THREE.SpriteMaterial({ map: texturaTexto('+' + brlM(r.recompensa).replace(/,00$/, ''), 160, 56, '800 34px Inter, sans-serif', '#fde68a', '#b45309'), transparent: true }));
    txt.scale.set(6, 2.1, 1); txt.position.set(x * U - 2.3, 7.4, z * U + .3); scene.add(txt); marcaMissao.push(txt);
    animar(t => { txt.position.y = 7.4 + Math.sin(t / 340 + i) * .25; mala.rotation.y = Math.sin(t / 900) * .25; });
  });
}
async function carregarMissoes() {
  const { data } = await sb.rpc('missoes_painel', { d: diaSP() });
  missoes = data || [];
  const b = $('#quest-btn'); b.hidden = !missoes.length;
  const meu = missoes.find(r => r.atendente_id === eu.id); b.classList.toggle('feita', !!meu?.cumpriu); b.querySelector('b').textContent = meu?.cumpriu ? '✓' : '!';
  b.onclick = abrirMissao;
  marcadoresMissao();
  if (!abriuMissao && missoes.length && /missao=1/.test(location.search)) { abriuMissao = true; setTimeout(() => { if (meu) { balao(eu.id, '💻 Nova missão no seu PC!', 2500); } abrirMissao(); }, 1400); }
}
setInterval(carregarMissoes, 60000);

/* ---------- início ---------- */
async function carregarEquipe() {
  const { data, error } = await sb.rpc('equipe_escritorio');
  if (!error && data) { equipe = data; atualizarAtores(); }
}
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return location.href = './';
  const { data: perfil } = await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle();
  if (!perfil || !perfil.ativo) return location.href = './';
  eu = perfil;
  if (eu.papel === 'advogado') { const v = document.querySelector('a[href="./"]'); if (v) { v.href = '../controle/'; v.textContent = '← Controle'; } }
  $('#btn-horarios').hidden = eu.papel !== 'admin';
  $('#relogio').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  XYZPresenca.entrar(sb, eu, {
    sync: st => { online = new Set(Object.keys(st)); syncOk = true; atualizarAtores(); },
    acao: executar,
    venda: m => { setTimeout(carregarMetas, 800); setTimeout(carregarMissoes, 1200); balao(m.id, '🎉 Fechei mais um!', 4000); particulas(m.id, '🎉', 6); particulas(m.id, '💰', 4); const a = atores.get(m.id); if (a) a.danca = T + 3000; },
  });
  await montarAmbiente(); await montarMoveis();
  await carregarEquipe(); await carregarMetas();
  requestAnimationFrame(quadro);
  setTimeout(() => carregarMissoes(), 800);
})();
</script>
<button id="quest-btn" hidden title="Missão diária"><span class="hex"></span><b>!</b></button>
<div id="quest" hidden></div>
