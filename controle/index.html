<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle · XYZ para Advogados</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#02060f;--painel:rgba(5,13,32,.82);--painel2:rgba(9,24,56,.85);--borda:rgba(30,144,255,.25);--texto:#eaf3ff;--suave:#93a9c9;--azul:#1e90ff;--azul2:#8cc8ff;--ciano:#00e5ff;--verde:#22c55e;--vermelho:#ef4444;--ouro:#fbbf24;--raio:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:radial-gradient(ellipse at 50% -10%,#0a2a66 0%,#02060f 60%) fixed;color:var(--texto);font-family:'Inter',system-ui,sans-serif;font-size:15px;min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:rgba(2,8,22,.7);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ciano)}
label{display:block;font-size:12px;color:var(--suave);margin:0 0 5px;font-weight:500}
.btn{background:linear-gradient(135deg,#b8860b,#fbbf24 60%,#fde68a);color:#1a1205;border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.sec{background:var(--painel2);color:var(--texto);border:1px solid var(--borda);font-weight:600}
.btn.peq{padding:7px 11px;font-size:13px}
.vidro{background:var(--painel);border:1px solid var(--borda);border-radius:var(--raio);backdrop-filter:blur(14px)}
.marca{font-weight:800;font-size:22px}.marca span{color:var(--ouro)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
#login form{width:100%;max-width:380px;padding:30px}
#login .sub{color:var(--suave);margin:6px 0 22px;font-size:14px}
.campo{margin-bottom:14px}.erro{color:#fca5a5;font-size:13px;margin-top:10px;min-height:18px}
.vip{display:inline-block;font-size:11px;font-weight:800;letter-spacing:1.5px;color:#1a1205;background:linear-gradient(135deg,#fbbf24,#fde68a);border-radius:99px;padding:3px 10px;margin-bottom:12px}
/* app */
header{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-bottom:1px solid var(--borda);gap:10px;flex-wrap:wrap}
header .acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
header .ola{color:var(--suave);font-size:14px}header .ola b{color:var(--texto)}
main{max-width:1240px;margin:0 auto;padding:22px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}.kpi span{font-size:12px;color:var(--suave)}.kpi b{display:block;font-size:26px;margin-top:2px}
.kpi.ouro b{color:var(--ouro)}
.barra{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px;align-items:end}
.tabela{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:11px 12px;font-size:12px;color:var(--suave);font-weight:600;background:rgba(7,20,48,.9);position:sticky;top:0}
td{padding:11px 12px;border-top:1px solid rgba(30,144,255,.12);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover{background:rgba(251,191,36,.06)}
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--borda);margin:1px 3px 1px 0;white-space:nowrap}
.st{font-size:12px;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--borda);color:var(--suave)}
.st.s1{border-color:#60a5fa;color:#93c5fd}.st.s2{border-color:var(--ouro);color:#fde68a}.st.s3{border-color:#a78bfa;color:#c4b5fd}.st.s4{border-color:var(--verde);color:#86efac}.st.s5{border-color:var(--vermelho);color:#fca5a5}
a.pasta{color:var(--ouro);text-decoration:none;font-weight:600}
.vazio{color:var(--suave);padding:30px;text-align:center}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,4,12,.7);display:grid;place-items:center;z-index:50;padding:16px}
#modal .caixa{width:100%;max-width:760px;max-height:92vh;overflow:auto;padding:22px}
.m-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.m-top h2{font-size:20px}.m-top .meta{color:var(--suave);font-size:13px;margin-top:4px;line-height:1.6}
.x{background:none;border:0;color:var(--suave);font-size:22px;cursor:pointer}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.sec-t{font-size:13px;color:var(--ouro);font-weight:700;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.8px}
.linha-tempo{display:flex;flex-direction:column;gap:6px}
.linha-tempo div{font-size:13px;color:var(--suave)}.linha-tempo b{color:var(--texto)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0b1a3a;border:1px solid var(--ouro);padding:10px 16px;border-radius:10px;z-index:60}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}.barra{grid-template-columns:1fr 1fr}.grade{grid-template-columns:1fr}.col-m{display:none}}
</style>
</head>
<body>
<!-- LOGIN -->
<section id="login" hidden>
  <form class="vidro" id="f-login">
    <span class="vip">ÁREA DO ADVOGADO</span>
    <div class="marca">XYZ <span>Controle</span></div>
    <p class="sub">Acompanhe os clientes indicados pela XYZ ao seu escritório.</p>
    <div class="campo"><label>Usuário (seu nome)</label><input id="l-user" required autocomplete="username" placeholder="ex.: Igor"></div>
    <div class="campo"><label>Senha</label><input type="password" id="l-senha" required autocomplete="current-password"></div>
    <button class="btn" style="width:100%" id="l-btn">Entrar</button>
    <div class="erro" id="l-erro"></div>
  </form>
</section>

<!-- APP -->
<section id="app" hidden>
  <header>
    <div class="marca">XYZ <span>Controle</span></div>
    <div class="acoes">
      <span class="ola">Olá, <b id="eu-nome"></b></span>
      <a class="btn sec peq" href="../crm/hiscon.html?de=controle">🔎 Analisar HISCON</a>
      <a class="btn sec peq" href="../crm/escritorio.html?de=controle">🛋️ Hall do escritório</a>
      <button class="btn sec peq" id="sair">Sair</button>
    </div>
  </header>
  <main>
    <div class="kpis">
      <div class="kpi vidro ouro"><span>Clientes indicados</span><b id="k-cli">–</b></div>
      <div class="kpi vidro"><span>Contratos (bancos)</span><b id="k-ctr">–</b></div>
      <div class="kpi vidro"><span>Indicados este mês</span><b id="k-mes">–</b></div>
      <div class="kpi vidro"><span>Sem status ainda</span><b id="k-sem">–</b></div>
    </div>
    <div class="barra">
      <div><label>Buscar (nome, CPF ou telefone)</label><input id="f-busca" placeholder="Digite…"></div>
      <div><label>Status</label><select id="f-status"><option value="">Todos</option></select></div>
      <div><label>Indicado de</label><input type="date" id="f-de"></div>
      <div><label>até</label><input type="date" id="f-ate"></div>
    </div>
    <div class="tabela vidro">
      <table><thead><tr><th>Cliente</th><th>CPF</th><th class="col-m">Telefone</th><th>Bancos</th><th class="col-m">Indicado em</th><th>Status</th><th>Pasta</th></tr></thead>
      <tbody id="lista"></tbody></table>
    </div>
  </main>
</section>

<!-- DETALHE -->
<div id="modal" hidden>
  <div class="caixa vidro" id="m-caixa"></div>
</div>

<script src="../crm/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../crm/presenca.js"></script>
<script>
const CFG = window.CRM_CONFIG, sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const so = s => String(s || '').replace(/\D/g, '');
const brl = v => v ? Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }) : '—';
const dBR = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '—';
const fmtCPF = c => { const d = so(c); return d.length === 11 ? d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : (c || '—'); };
const fmtTel = t => { const d = so(t); return d.length === 11 ? d.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3') : d.length === 10 ? d.replace(/(\d{2})(\d{4})(\d{4})/, '($1) $2-$3') : (t || '—'); };
const toast = m => { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 3500); };
const STATUS = ['Documentação recebida', 'Em análise', 'Aguardando documentos', 'Ação protocolada', 'Liminar/decisão favorável', 'Acordo', 'Sentença procedente', 'Pago', 'Improcedente', 'Desistência'];
const clsSt = s => !s ? '' : /pago|acordo|procedente|favor/i.test(s) ? 's4' : /improced|desist/i.test(s) ? 's5' : /protocol/i.test(s) ? 's3' : /aguard/i.test(s) ? 's2' : 's1';
$('#f-status').innerHTML = '<option value="">Todos</option><option value="-">Sem status</option>' + STATUS.map(s => `<option>${s}</option>`).join('');
let eu = null, todos = [];

const slug = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/^dra?\.?\s*/, '').trim().split(/\s+/)[0];
$('#f-login').onsubmit = async e => {
  e.preventDefault();
  const u = $('#l-user').value.trim(), b = $('#l-btn'); b.disabled = true; $('#l-erro').textContent = '';
  const email = u.includes('@') ? u.toLowerCase() : slug(u) + '@adv.xyzmarketing.com.br';
  const { error } = await sb.auth.signInWithPassword({ email, password: $('#l-senha').value });
  b.disabled = false;
  if (error) return $('#l-erro').textContent = /invalid/i.test(error.message) ? 'Usuário ou senha incorretos.' : error.message;
  iniciar();
};
$('#sair').onclick = async () => { try { XYZPresenca.sair(); } catch (e) {} await sb.auth.signOut(); location.reload(); };

async function iniciar() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').hidden = false; $('#app').hidden = true; return; }
  const { data: p } = await sb.from('perfis').select('*').eq('id', session.user.id).maybeSingle();
  if (!p || !p.ativo) { await sb.auth.signOut(); $('#login').hidden = false; $('#l-erro').textContent = 'Acesso não liberado. Fale com a XYZ.'; return; }
  if (p.papel === 'atendente') return location.href = '../crm/';
  eu = p; $('#login').hidden = true; $('#app').hidden = false;
  $('#eu-nome').textContent = p.papel === 'advogado' ? 'Dr(a). ' + p.nome : p.nome + ' (admin)';
  try { XYZPresenca.entrar(sb, eu, {}); } catch (e) {}
  carregar();
}

async function carregar() {
  let dados = [];
  for (let de = 0; de < 20000; de += 1000) {
    const { data, error } = await sb.from('clientes').select('id,nome,cpf,telefone,data_contato,banco,advogado,observacoes,pasta_url,status_adv,obs_adv,status_adv_em')
      .order('data_contato', { ascending: false }).range(de, de + 999);
    if (error || !data) break; dados = dados.concat(data); if (data.length < 1000) break;
  }
  // agrupa por CPF (um cliente pode ter contrato em vários bancos)
  const g = new Map();
  dados.forEach(c => {
    const k = so(c.cpf) || 'id' + c.id;
    if (!g.has(k)) g.set(k, { k, nome: c.nome, cpf: c.cpf, telefone: c.telefone, data: c.data_contato, contratos: [], pasta: null, status: null, obs: null, statusEm: null, adv: c.advogado });
    const x = g.get(k); x.contratos.push(c);
    if (c.data_contato && (!x.data || c.data_contato < x.data)) x.data = c.data_contato;
    x.pasta = x.pasta || c.pasta_url; x.telefone = x.telefone || c.telefone;
    if (c.status_adv && (!x.statusEm || c.status_adv_em > x.statusEm)) { x.status = c.status_adv; x.obs = c.obs_adv; x.statusEm = c.status_adv_em; }
  });
  todos = [...g.values()].sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const mes = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }).slice(0, 7);
  $('#k-cli').textContent = todos.length; $('#k-ctr').textContent = dados.length;
  $('#k-mes').textContent = todos.filter(x => (x.data || '').startsWith(mes)).length;
  $('#k-sem').textContent = todos.filter(x => !x.status).length;
  desenhar();
}
let tb; $('#f-busca').oninput = () => { clearTimeout(tb); tb = setTimeout(desenhar, 200); };
['#f-status', '#f-de', '#f-ate'].forEach(s => $(s).onchange = desenhar);
function desenhar() {
  const t = $('#f-busca').value.trim().toLowerCase(), d = so(t), st = $('#f-status').value, de = $('#f-de').value, ate = $('#f-ate').value;
  const lista = todos.filter(x => (!t || x.nome.toLowerCase().includes(t) || (d.length >= 3 && (so(x.cpf).includes(d) || so(x.telefone).includes(d))))
    && (!st || (st === '-' ? !x.status : x.status === st)) && (!de || (x.data || '') >= de) && (!ate || (x.data || '') <= ate));
  $('#lista').innerHTML = lista.map(x => `<tr data-k="${esc(x.k)}">
    <td><b>${esc(x.nome)}</b></td><td>${fmtCPF(x.cpf)}</td><td class="col-m">${fmtTel(x.telefone)}</td>
    <td>${[...new Set(x.contratos.map(c => c.banco).filter(Boolean))].map(b => `<span class="chip">${esc(b)}</span>`).join('')}</td>
    <td class="col-m">${dBR(x.data)}</td><td>${x.status ? `<span class="st ${clsSt(x.status)}">${esc(x.status)}</span>` : '<span class="st">—</span>'}</td>
    <td>${x.pasta ? `<a class="pasta" href="${esc(x.pasta)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📁 Abrir</a>` : '<span style="color:var(--suave)">—</span>'}</td></tr>`).join('')
    || '<tr><td colspan="7" class="vazio">Nenhum cliente encontrado.</td></tr>';
  $$('#lista tr[data-k]').forEach(tr => tr.onclick = () => abrir(todos.find(x => x.k === tr.dataset.k)));
}

function abrir(x) {
  const obsGerais = [...new Set(x.contratos.map(c => c.observacoes).filter(Boolean))];
  $('#m-caixa').innerHTML = `
    <div class="m-top"><div><h2>${esc(x.nome)}</h2>
      <div class="meta">CPF ${fmtCPF(x.cpf)} · Tel ${fmtTel(x.telefone)} · indicado em ${dBR(x.data)}</div></div>
      <button class="x" id="m-x">✕</button></div>
    ${x.pasta ? `<a class="btn" href="${esc(x.pasta)}" target="_blank" rel="noopener">📁 Abrir pasta de documentos no Google Drive</a>` : '<div class="st" style="display:inline-block">Pasta de documentos ainda não vinculada pela XYZ</div>'}
    <div class="sec-t">Contratos indicados (${x.contratos.length})</div>
    <div class="tabela vidro"><table><thead><tr><th>Banco</th><th>Fechado em</th><th>Status</th></tr></thead><tbody>
      ${x.contratos.map(c => `<tr style="cursor:default"><td>${esc(c.banco || '—')}</td><td>${dBR(c.data_contato)}</td><td>${c.status_adv ? `<span class="st ${clsSt(c.status_adv)}">${esc(c.status_adv)}</span>` : '—'}</td></tr>`).join('')}
    </tbody></table></div>
    ${obsGerais.length ? `<div class="sec-t">Observações da XYZ</div><div class="linha-tempo">${obsGerais.map(o => `<div>${esc(o)}</div>`).join('')}</div>` : ''}
    <div class="sec-t">Atualizar status</div>
    <div class="grade">
      <div><label>Status do caso</label><select id="m-st"><option value="">— sem status —</option>${STATUS.map(s => `<option ${s === x.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div><label>Aplicar a</label><select id="m-alvo"><option value="todos">Todos os contratos deste cliente</option>${x.contratos.map(c => `<option value="${c.id}">Só ${esc(c.banco || 'contrato ' + c.id)}</option>`).join('')}</select></div>
    </div>
    <div style="margin-top:10px"><label>Observação para a XYZ (opcional)</label><textarea id="m-obs" rows="3" placeholder="Ex.: falta comprovante de residência; processo nº…">${esc(x.obs || '')}</textarea></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px;flex-wrap:wrap">
      <small style="color:var(--suave)">${x.statusEm ? 'Última atualização: ' + new Date(x.statusEm).toLocaleString('pt-BR') : ''}</small>
      <button class="btn" id="m-salvar">Salvar status</button></div>`;
  $('#modal').hidden = false;
  $('#m-x').onclick = () => $('#modal').hidden = true;
  $('#m-salvar').onclick = async () => {
    const b = $('#m-salvar'); b.disabled = true;
    const alvo = $('#m-alvo').value, ids = alvo === 'todos' ? x.contratos.map(c => c.id) : [Number(alvo)];
    try {
      for (const id of ids) { const { error } = await sb.rpc('adv_status', { p_cliente: id, p_status: $('#m-st').value, p_obs: $('#m-obs').value }); if (error) throw error; }
      $('#modal').hidden = true; toast('Status salvo ✔'); carregar();
    } catch (e) { alert('Não consegui salvar: ' + e.message); }
    b.disabled = false;
  };
}
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').hidden = true; };
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#modal').hidden = true; });
iniciar();
</script>
</body>
</html>
